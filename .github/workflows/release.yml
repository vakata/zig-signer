name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  APP_NAME: signer
  ZIG_VERSION: 0.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
            exe_ext: ""

          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
            exe_ext: ""

          - os: macos-15-intel
            artifact: macos-x86_64
            exe_ext: ""

          - os: macos-15
            artifact: macos-aarch64
            exe_ext: ""

          - os: windows-latest
            artifact: windows-x86_64
            exe_ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Test
        run: zig build test -Doptimize=ReleaseFast

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          archive="${APP_NAME}-${{ matrix.artifact }}"

          tar -C zig-out/bin \
            -czf "dist/${archive}.tar.gz" \
            "${APP_NAME}${{ matrix.exe_ext }}" \
            "${APP_NAME}-picker${{ matrix.exe_ext }}"

          if command -v sha256sum >/dev/null 2>&1; then
            (
              cd dist
              sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
            )
          else
            (
              cd dist
              shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
            )
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: find dist -maxdepth 1 -type f -print

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes

  homebrew:
    needs: release
    runs-on: ubuntu-latest
  
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
  
      - name: Read checksums
        id: sha
        shell: bash
        run: |
          echo "maca=$(cut -d' ' -f1 dist/signer-macos-aarch64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "linuxa=$(cut -d' ' -f1 dist/signer-linux-aarch64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "macx=$(cut -d' ' -f1 dist/signer-macos-x86_64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "linuxx=$(cut -d' ' -f1 dist/signer-linux-x86_64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
  
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: vakata/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
  
      - name: Update formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          MAC_ARM_SHA: ${{ steps.sha.outputs.maca }}
          MAC_X86_SHA: ${{ steps.sha.outputs.macx }}
          LINUX_ARM_SHA: ${{ steps.sha.outputs.linuxa }}
          LINUX_X86_SHA: ${{ steps.sha.outputs.linuxx }}
        run: |
          VERSION="${VERSION}"

          cat > tap/Formula/signer.rb <<EOF
          class Signer < Formula
            desc "Local HTTP service for signing data with PKCS#11 certificates"
            homepage "https://github.com/vakata/zig-signer"
            version "$(VERSION)"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/vakata/zig-signer/releases/download/0.0.4/signer-macos-aarch64.tar.gz"
                sha256 "$(MAC_ARM_SHA)"
              end

              on_intel do
                url "https://github.com/vakata/zig-signer/releases/download/0.0.4/signer-macos-x86_64.tar.gz"
                sha256 "$(MAC_X86_SHA)"
              end
            end

            on_linux do
              depends_on "gtk+3"

              on_arm do
                url "https://github.com/vakata/zig-signer/releases/download/0.0.4/signer-linux-aarch64.tar.gz"
                sha256 "$(LINUX_ARM_SHA)"
              end

              on_intel do
                url "https://github.com/vakata/zig-signer/releases/download/0.0.4/signer-linux-x86_64.tar.gz"
                sha256 "$(LINUX_X86_SHA)"
              end
            end

            def install
              bin.install "signer", "signer-picker"
            end

            test do
              assert_predicate bin/"signer", :executable?
              assert_predicate bin/"signer-picker", :executable?
            end
          end
          EOF

      - name: Commit formula
        working-directory: tap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
  
          git add Formula/signer.rb
          git commit -m "signer ${GITHUB_REF_NAME}"
          git push

