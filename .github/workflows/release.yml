name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  APP_NAME: signer
  ZIG_VERSION: 0.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: linux-x86_64

          - os: ubuntu-latest
            target: aarch64-linux
            artifact: linux-aarch64

          - os: macos-latest
            target: x86_64-macos
            artifact: macos-x86_64

          - os: macos-latest
            target: aarch64-macos
            artifact: macos-aarch64

          - os: windows-latest
            target: x86_64-windows
            artifcat: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dtarget=${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          archive="${APP_NAME}-${{ matrix.artifact }}"

          tar -C zig-out/bin \
            -czf "dist/${archive}.tar.gz" \
            "${APP_NAME}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"
          else
            shasum -a 256 "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"
          fi

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: find dist -type f -maxdepth 1 -print

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes

